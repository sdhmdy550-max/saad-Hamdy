<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacology Quiz</title>
<style>
/* ========== Base & Theme ========== */
:root {
  --navy-dark: #1a1f3a;
  --navy-mid: #232b4a;
  --navy-light: #2d3561;
  --cyan: #4fc3f7;
  --cyan-dark: #039be5;
  --cyan-glow: rgba(79,195,247,0.3);
  --purple: #9c88ff;
  --green: #4caf50;
  --green-light: #66bb6a;
  --red: #ef5350;
  --red-light: #ff6b6b;
  --gold: #ffd54f;
  --card-bg: rgba(35,43,74,0.7);
  --card-border: rgba(79,195,247,0.15);
  --text: #ffffff;
  --text-dim: #b0bec5;
  --text-muted: #78909c;
  --glass-blur: blur(16px);
  --whatsapp: #25D366;
}

*{box-sizing:border-box;margin:0;padding:0}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-light) 50%, var(--navy-dark) 100%);
  background-size: 400% 400%;
  animation: gradBg 15s ease infinite;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Animated stars background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.2), transparent),
    radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.3), transparent);
  background-size: 200px 100px;
  animation: twinkle 4s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes gradBg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes twinkle {
  0%{opacity:0.5}
  100%{opacity:1}
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--navy-dark)}
::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}

/* ========== Layout Container ========== */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* ========== Glass Card ========== */
.glass {
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* ========== Start Screen ========== */
.start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  animation: fadeInUp .8s ease;
}

@keyframes fadeInUp {
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

.start-badge {
  background: var(--cyan);
  color: var(--navy-dark);
  padding: 8px 28px;
  border-radius: 25px;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  display: inline-block;
}

.start-title {
  font-size: 2.4rem;
  font-weight: 800;
  margin-bottom: 14px;
  line-height: 1.4;
}

.start-title .accent { color: var(--cyan); }

.start-subtitle {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.start-user {
  color: var(--green-light);
  font-size: .95rem;
  font-weight: 600;
  margin-bottom: 30px;
}

.start-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 500px;
  margin-bottom: 30px;
}

.start-stat {
  padding: 20px 14px;
  text-align: center;
  transition: transform .3s;
}
.start-stat:hover { transform: translateY(-4px); }

.start-stat-num {
  font-size: 2rem;
  font-weight: 800;
  color: var(--cyan);
  margin-bottom: 6px;
}

.start-stat-label {
  font-size: .82rem;
  color: var(--text-dim);
}

.start-btn {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #fff;
  border: none;
  padding: 16px 56px;
  border-radius: 30px;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  box-shadow: 0 6px 24px var(--cyan-glow);
  margin-bottom: 16px;
}
.start-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 36px var(--cyan-glow); }

.start-whatsapp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  background: var(--whatsapp);
  color: #fff;
  border: none;
  border-radius: 25px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  text-decoration: none;
}
.start-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(37,211,102,.4); }

/* ========== Quiz Screen ========== */
.quiz-screen { display:none; animation: fadeInUp .6s ease; }
.quiz-screen.active { display:block; }

/* Top bar */
.quiz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.topbar-badge {
  background: var(--cyan);
  color: var(--navy-dark);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: 1px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-btn {
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s;
}
.topbar-btn:hover { background: var(--cyan); color: var(--navy-dark); transform: rotate(15deg); }

.wa-btn {
  background: var(--whatsapp);
  border: none;
  color: #fff;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
}
.wa-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,211,102,.4); }

/* Stats Row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.stat-card {
  padding: 16px;
  text-align: center;
  transition: transform .3s;
}
.stat-card:hover { transform: translateY(-3px); }

.stat-num { font-size: 1.6rem; font-weight: 800; color: var(--cyan); margin-bottom: 4px; }
.stat-label { font-size: .78rem; color: var(--text-dim); }

/* Progress Bar */
.progress-wrap {
  margin-bottom: 20px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 600;
}

.progress-bar-bg {
  height: 6px;
  background: rgba(35,43,74,.8);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  border-radius: 3px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
  position: relative;
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* Question Nav Buttons */
.q-nav-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  justify-content: center;
  flex-wrap: wrap;
}

.q-nav-btn {
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  padding: 8px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: .82rem;
  font-weight: 600;
  transition: all .3s;
}
.q-nav-btn:hover { background: rgba(79,195,247,.2); color: var(--cyan); }
.q-nav-btn.active { background: var(--cyan); color: var(--navy-dark); border-color: var(--cyan); }
.q-nav-btn.answered-correct { background: rgba(76,175,80,.3); border-color: var(--green); color: var(--green-light); }
.q-nav-btn.answered-wrong { background: rgba(239,83,80,.2); border-color: var(--red); color: var(--red-light); }

/* Question Card */
.question-card {
  padding: 28px 24px;
  margin-bottom: 16px;
  animation: cardIn .5s ease;
}

@keyframes cardIn {
  from{opacity:0;transform:translateY(20px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.q-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.q-number {
  background: rgba(79,195,247,.15);
  color: var(--cyan);
  padding: 4px 14px;
  border-radius: 10px;
  font-size: .82rem;
  font-weight: 700;
}

.q-type {
  font-size: .75rem;
  color: var(--text-muted);
  background: rgba(156,136,255,.15);
  color: var(--purple);
  padding: 4px 12px;
  border-radius: 8px;
  font-weight: 600;
}

.q-text {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.8;
  margin-bottom: 22px;
  direction: ltr;
  text-align: left;
  color: var(--text);
}

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  direction: ltr;
  margin-bottom: 20px;
}

.opt-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: rgba(35,43,74,.5);
  border: 2px solid rgba(79,195,247,.12);
  border-radius: 14px;
  cursor: pointer;
  transition: all .3s;
  text-align: left;
  direction: ltr;
  font-size: .95rem;
  color: var(--text);
  position: relative;
  overflow: hidden;
}

.opt-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(79,195,247,.08), rgba(156,136,255,.08));
  opacity: 0;
  transition: opacity .3s;
}

.opt-btn:hover:not(.disabled)::before { opacity: 1; }

.opt-btn:hover:not(.disabled) {
  border-color: var(--cyan);
  transform: translateX(-4px);
  box-shadow: 0 4px 20px var(--cyan-glow);
}

.opt-letter {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: .9rem;
  flex-shrink: 0;
  transition: all .3s;
  position: relative;
  z-index: 1;
}

.opt-btn:hover:not(.disabled) .opt-letter { transform: scale(1.1); }

.opt-btn.correct {
  border-color: var(--green) !important;
  background: rgba(76,175,80,.15) !important;
  animation: correctPop .6s ease;
}
.opt-btn.correct .opt-letter { background: linear-gradient(135deg, var(--green), var(--green-light)) !important; }

.opt-btn.wrong {
  border-color: var(--red) !important;
  background: rgba(239,83,80,.12) !important;
  animation: wrongShake .5s ease;
}
.opt-btn.wrong .opt-letter { background: linear-gradient(135deg, var(--red), var(--red-light)) !important; }

.opt-btn.show-correct {
  border-color: var(--green) !important;
  background: rgba(76,175,80,.1) !important;
  opacity: 1 !important;
}
.opt-btn.show-correct .opt-letter { background: linear-gradient(135deg, var(--green), var(--green-light)) !important; }

.opt-btn.disabled { cursor: default; opacity: .5; pointer-events: none; }
.opt-btn.correct.disabled, .opt-btn.wrong.disabled, .opt-btn.show-correct.disabled { opacity: 1; }

@keyframes correctPop { 0%{transform:scale(1)} 50%{transform:scale(1.02)} 100%{transform:scale(1)} }
@keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

/* Explanation Panel */
.explanation-panel {
  border-top: 1px solid var(--card-border);
  padding-top: 18px;
  margin-top: 8px;
  animation: fadeInUp .5s ease;
}

.exp-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.exp-icon {
  font-size: 2.2rem;
  animation: bounceIn .6s ease;
}

@keyframes bounceIn { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }

.exp-result {
  font-size: 1.05rem;
  font-weight: 700;
}
.exp-result.correct-text { color: var(--green-light); }
.exp-result.wrong-text { color: var(--red-light); }

.exp-label {
  font-size: .85rem;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.exp-text {
  font-size: .95rem;
  line-height: 1.9;
  color: var(--text-dim);
  direction: rtl;
  text-align: right;
  padding: 14px;
  background: rgba(79,195,247,.06);
  border-radius: 12px;
  border-right: 3px solid var(--cyan);
}

/* Navigation */
.nav-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 18px 0;
  flex-wrap: wrap;
}

.nav-btn {
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  color: var(--text);
  padding: 10px 28px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: .92rem;
  transition: all .3s;
}
.nav-btn:hover { background: var(--cyan); color: var(--navy-dark); transform: translateY(-2px); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
.nav-btn.primary { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #fff; border: none; }
.nav-btn.primary:hover { box-shadow: 0 6px 20px var(--cyan-glow); }
.nav-btn.finish { background: linear-gradient(135deg, var(--gold), #ff9800); color: var(--navy-dark); border: none; }

.jump-row {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}

.jump-input {
  width: 70px;
  padding: 8px 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  text-align: center;
  color: var(--text);
  font-size: .92rem;
  outline: none;
}
.jump-input:focus { border-color: var(--cyan); }

.jump-go {
  background: var(--cyan);
  color: var(--navy-dark);
  border: none;
  padding: 8px 20px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
}
.jump-go:hover { background: var(--purple); color: #fff; }

/* Filter Row */
.filter-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
  flex-wrap: wrap;
}

.filter-btn {
  background: var(--card-bg);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  padding: 5px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: .78rem;
  font-weight: 600;
  transition: all .3s;
}
.filter-btn:hover, .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(79,195,247,.1); }

/* ========== Results Screen ========== */
.results-screen {
  display: none;
  text-align: center;
  padding: 30px 0;
  animation: fadeInUp .8s ease;
}
.results-screen.active { display: block; }

.results-card {
  padding: 44px;
  max-width: 550px;
  margin: 0 auto;
}

.results-emoji { font-size: 4rem; margin-bottom: 14px; }

.results-title {
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.results-subtitle {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 28px;
}

.results-score {
  font-size: 4.5rem;
  font-weight: 900;
  margin-bottom: 6px;
}
.results-score.excellent { color: var(--green-light); }
.results-score.good { color: var(--cyan); }
.results-score.poor { color: var(--red-light); }

.results-pct {
  font-size: 1.1rem;
  color: var(--text-muted);
  margin-bottom: 28px;
}

.results-breakdown {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.breakdown-item {
  padding: 16px;
  text-align: center;
}

.breakdown-val { font-size: 1.8rem; font-weight: 800; }
.breakdown-lbl { font-size: .78rem; color: var(--text-dim); margin-top: 4px; }

.results-bar-wrap {
  height: 14px;
  background: rgba(35,43,74,.8);
  border-radius: 7px;
  overflow: hidden;
  margin-bottom: 28px;
  display: flex;
}
.results-bar-ok { height: 100%; background: var(--green); transition: width 1s; }
.results-bar-err { height: 100%; background: var(--red); transition: width 1s; }

.restart-btn {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  color: #fff;
  border: none;
  padding: 14px 48px;
  border-radius: 30px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .3s;
  box-shadow: 0 4px 20px var(--cyan-glow);
}
.restart-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px var(--cyan-glow); }

/* Confetti */
.confetti-box { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
.confetti-p { position: absolute; border-radius: 2px; animation: confettiDrop 1.5s ease-out forwards; }
@keyframes confettiDrop { 0%{transform:translateY(-10vh) rotate(0);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* Floating pill icon */
.floating-pill {
  position: fixed;
  bottom: 30px;
  left: 30px;
  font-size: 2rem;
  animation: floatPill 3s ease-in-out infinite;
  z-index: 1;
  opacity: .6;
}
@keyframes floatPill { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

/* Responsive */
@media(max-width:768px){
  .app-container{padding:12px}
  .start-title{font-size:1.6rem}
  .start-stats{grid-template-columns:1fr;max-width:300px}
  .stats-row{grid-template-columns:1fr}
  .results-breakdown{grid-template-columns:1fr}
  .results-card{padding:24px}
  .q-nav-row{gap:4px}
  .q-nav-btn{padding:6px 12px;font-size:.72rem}
  .floating-pill{display:none}
}
</style>
</head>
<body>

<!-- Floating pill -->
<div class="floating-pill">&#128138;</div>

<!-- Confetti -->
<div class="confetti-box" id="confettiBox"></div>

<div class="app-container">

  <!-- ========== START SCREEN ========== -->
  <div class="start-screen" id="startScreen">
    <div class="start-badge">PHARMACOLOGY QUIZ</div>
    <div class="start-title"><span class="accent">&#1575;&#1582;&#1578;&#1576;&#1575;&#1585;</span> &#1575;&#1604;&#1571;&#1583;&#1608;&#1610;&#1577;</div>
    <div class="start-subtitle">200 &#1587;&#1572;&#1575;&#1604; - &#1583;&#1585;&#1580;&#1577; 200 - &#1578;&#1589;&#1581;&#1610;&#1581; &#1601;&#1608;&#1585;&#1610;</div>
    <div class="start-user">&#127891; &#1591;&#1575;&#1604;&#1576; &#1591;&#1576; &#1576;&#1588;&#1585;&#1610;</div>

    <div class="start-stats">
      <div class="start-stat glass">
        <div class="start-stat-num">200</div>
        <div class="start-stat-label">&#1606;&#1602;&#1575;&#1591; &#1575;&#1604;&#1578;&#1602;&#1610;&#1610;&#1605;</div>
      </div>
      <div class="start-stat glass">
        <div class="start-stat-num" id="startCorrect">0</div>
        <div class="start-stat-label">&#1575;&#1604;&#1573;&#1580;&#1575;&#1576;&#1575;&#1578; &#1575;&#1604;&#1589;&#1581;&#1610;&#1581;&#1577;</div>
      </div>
      <div class="start-stat glass">
        <div class="start-stat-num" id="startWrong">0</div>
        <div class="start-stat-label">&#1575;&#1604;&#1573;&#1580;&#1575;&#1576;&#1575;&#1578; &#1575;&#1604;&#1582;&#1575;&#1591;&#1574;&#1577;</div>
      </div>
    </div>

mimetics is preferable for the treatment of chronic orthostatic hypotension:", "options": [{"letter": "A", "text": "Epinephrine"}, {"letter": "B", "text": "Norepinephrine"}, {"letter": "C", "text": "Ephedrine"}, {"letter": "D", "text": "Salmeterol"}], "correct": "C", "correct_text": "Ephedrine", "explanation": "الإيفيدرين يمكن إعطاؤه عن طريق الفم ويمتلك مدة مفعول طويلة نسبياً، مما يجعله مناسباً ومستخدماً في تدبير حالات هبوط ضغط الدم الانتصابي المزمن (عند الوقوف)."}, {"num": 72, "question": "The incidence of morbidity and mortality does not significantly decrease when hypertension is diagnosed early and is properly treated.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "العبارة خاطئة تماماً. التشخيص المبكر والعلاج الصحيح لارتفاع ضغط الدم يقللان بشكل كبير جداً من مخاطر الإصابة بالسكتات الدماغية، الجلطات، والفشل الكلوي، وبالتالي يقللان من الوفيات."}, {"num": 73, "question": "Which term describes the study of drug effects on the body?", "options": [{"letter": "A", "text": "Pharmacokinetics"}, {"letter": "B", "text": "Pharmacodynamics"}, {"letter": "C", "text": "Toxicology"}, {"letter": "D", "text": "Biochemistry"}], "correct": "B", "correct_text": "Pharmacodynamics", "explanation": "يركز هذا المفهوم على الآليات الحيوية التي يغير بها الدواء وظائف الجسم واستجابة الأعضاء والمستقبلات له (الديناميكية الدوائية)."}, {"num": 74, "question": "Bethanechol has a strong muscarinic activity but lacks nicotinic actions.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "يتميز البيثانيكول بانتقائيته العالية لتحفيز المستقبلات المسكارينية (في المثانة والجهاز الهضمي) دون التأثير على المستقبلات النيكوتينية."}, {"num": 75, "question": "Which antihypertensive drug is contraindicated in pregnancy?", "options": [{"letter": "A", "text": "ACE inhibitors"}, {"letter": "B", "text": "Methyldopa"}, {"letter": "C", "text": "Labetalol"}, {"letter": "D", "text": "Nifedipine"}], "correct": "A", "correct_text": "ACE inhibitors", "explanation": "عقار ميثيلدوبا هو الخيار الأكثر أماناً وشيوعاً للحوامل، بينما يحظر استخدام مثبطات الإنزيم المحول للأنجيوتنسين (ACE inhibitors) لخطورتها وتسببها في تشوهات بالغة لأجنة البشر."}, {"num": 76, "question": "Labetalol considers block alpha1, and beta2 only.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "اللابيتالول هو حاصر غير انتقائي، حيث يقوم بغلق مستقبلات ألفا-1 بالإضافة إلى مستقبلات بيتا غير الانتقائية (بيتا 1 وبيتا 2)."}, {"num": 77, "question": "Which drug class reduces blood pressure by preventing Angiotensin II formation?", "options": [{"letter": "A", "text": "ACE inhibitors"}, {"letter": "B", "text": "Beta-blockers"}, {"letter": "C", "text": "Calcium channel blockers"}, {"letter": "D", "text": "Diuretics"}], "correct": "A", "correct_text": "ACE inhibitors", "explanation": "تعمل هذه الفئة (مثبطات الإنزيم المحول للأنجيوتنسين) على تثبيط الإنزيم المسؤول عن تحويل وإنتاج هذا المركب القوي القابض للأوعية الدموية، مما يسبب توسعها وانخفاض الضغط."}, {"num": 78, "question": "ACE inhibitors cause high blood Pressure.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "صياغة السؤال خاطئة علمياً، لأن هذه العائلة الدوائية تستخدم أساساً لخفض ضغط الدم المرتفع وليس لرفعه."}, {"num": 79, "question": "……… Cause increases the Production of nitric oxide (Vasodilation).", "options": [{"letter": "A", "text": "Propranolol"}, {"letter": "B", "text": "Atenolol"}, {"letter": "C", "text": "Nebivolol"}, {"letter": "D", "text": "Clonidine"}], "correct": "C", "correct_text": "Nebivolol", "explanation": "النيبيفولول هو حاصر بيتا حديث يتميز بآلية عمل فريدة، حيث تحفز بطانة الأوعية الدموية لإنتاج أكسيد النيتريك (NO) الذي يوسع الشرايين ويخفض الضغط بفعالية."}, {"num": 80, "question": "The drug used as an antidote for tubocurarine is:", "options": [{"letter": "A", "text": "Neostigmine"}, {"letter": "B", "text": "Pilocarpine"}, {"letter": "C", "text": "Bethanechol"}, {"letter": "D", "text": "Atropine"}], "correct": "A", "correct_text": "Neostigmine", "explanation": "النيوستيجمين يثبط إنزيم الكولينستيراز مما يرفع مستويات الأستيل كولين ليتنافس بقوة ويتغلب على حصار التوبوكورارين (مرخي العضلات) ويعيد نشاط العضلات."}, {"num": 81, "question": "Which of the following alternatives reduces peripheral vascular resistance and arterial pressure?", "options": [{"letter": "A", "text": "Prazosin"}, {"letter": "B", "text": "Calcium channel blocker"}, {"letter": "C", "text": "Thiazide"}, {"letter": "D", "text": "Diuretics"}], "correct": "A", "correct_text": "Prazosin", "explanation": "البرازوسين يعمل على إرخاء العضلات الملساء في الأوعية الدموية، مما يؤدي إلى خفض المقاومة الطرفية وضغط الدم."}, {"num": 82, "question": "Normal blood ejected per each beat of the heart is 50ml/beat.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "حجم الضربة الطبيعي في المتوسط يتراوح بين 70 إلى 80 مل لكل ضربة، وبالتالي فإن رقم 50 مل يعتبر أقل من المعدل الطبيعي المعتاد."}, {"num": 83, "question": "Which of the following is recommended in Pre-hypertension?", "options": [{"letter": "A", "text": "Decrease potassium"}, {"letter": "B", "text": "Reduce weight"}, {"letter": "C", "text": "Increase sodium"}, {"letter": "D", "text": "All of them"}], "correct": "B", "correct_text": "Reduce weight", "explanation": "تعديل نمط الحياة وإنقاص الوزن الزائد يعتبر الخطوة الأولى والأهم للتحكم في ضغط الدم ومنع تطوره في مرحلة ما قبل ارتفاع الضغط."}, {"num": 84, "question": "Abrupt withdrawal of beta blockers may induce angina.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "يؤدي التوقف المفاجئ عن حاصرات بيتا أو بعض مضادات الضغط المركزية إلى حدوث رد فعل ارت ندينات الوعائية مما يساهم في إرخاء الأوعية الدموية الكلوية وزيادة تدفق الدم إلى الكليتين."}, {"num": 90, "question": "The onset of action of Spironolactone develops very slowly.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "يعمل السبيرونولاكتون عبر التأثير على التصنيع الجيني للبروتينات، لذلك يحتاج إلى عدة أيام ليبدأ مفعوله الإكلينيكي في الظهور."}, {"num": 91, "question": "Which drug causes an increase in the production of nitric oxide (vasodilation)?", "options": [{"letter": "A", "text": "Propranolol"}, {"letter": "B", "text": "Atenolol"}, {"letter": "C", "text": "Nebivolol"}, {"letter": "D", "text": "Clonidine"}], "correct": "C", "correct_text": "Nebivolol", "explanation": "النيبيفولول هو حاصر بيتا حديث يتميز بآلية عمل فريدة تحفز بطانة الأوعية الدموية لإنتاج أكسيد النيتريك الذي يوسع الشرايين ويخفض الضغط."}, {"num": 92, "question": "Clonidine is useful in the treatment of hypertension complicated by renal disease.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "الكلونيدين يعمل مركزياً ولا يقلل من تدفق الدم الكلوي بشكل ملحوظ، مما يجعله خياراً مفيداً عندما يترافق ضغط الدم مع اعتلال في وظائف الكلى."}, {"num": 93, "question": "Arteriodilator side effects include:", "options": [{"letter": "A", "text": "Chest pain"}, {"letter": "B", "text": "Headache"}, {"letter": "C", "text": "Rapid heart beat"}, {"letter": "D", "text": "All the above"}], "correct": "D", "correct_text": "All the above", "explanation": "موسعات الشرايين المباشرة تسبب صداعاً، ورد فعل منعكس يزيد من سرعة ضربات القلب، مما قد يسبب ألماً في الصدر."}, {"num": 94, "question": "Dobutamine is a selective beta-1 receptor agonist.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "الدوبوتامين محفز انتقائي قوي لمستقبلات بيتا-1 القلبية ويستخدم لزيادة قوة ضخ الدم في حالات الفشل القلبي الحاد."}, {"num": 95, "question": "Which of the following are calcium channel blockers?", "options": [{"letter": "A", "text": "Verapamil"}, {"letter": "B", "text": "Nifedipine"}, {"letter": "C", "text": "Diltiazem"}, {"letter": "D", "text": "All the above"}], "correct": "D", "correct_text": "All the above", "explanation": "الفيراباميل والنيفيديبين والديلتيازيم كلها مجموعات كيميائية مختلفة تنتمي طبياً وصيدلانياً لعائلة حاصرات قنوات الكالسيوم."}, {"num": 96, "question": "Activation of alpha-1 receptors causes vasodilatation.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "تحفيز مستقبلات ألفا-1 على العضلات الملساء للأوعية الدموية يؤدي إلى انقباضها وضيقها الشديد وليس توسعها."}, {"num": 97, "question": "What drug is used to stimulate autonomic ganglia?", "options": [{"letter": "A", "text": "Muscarine"}, {"letter": "B", "text": "Nicotine"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", "text": "Pilocarpine"}], "correct": "B", "correct_text": "Nicotine", "explanation": "النيكوتين يعمل بشكل أساسي على تحفيز مستقبلات النيكوتين الموجودة في العقد العصبية للجهاز العصبي الذاتي."}, {"num": 98, "question": "Dopamine can activate beta-2 receptors significantly.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "يعمل الدوبامين على مستقبلات معينة، لكن تأثيره على مستقبلات بيتا-2 يعتبر ضئيلاً جداً وغير مؤثر سريرياً."}, {"num": 99, "question": "Which of the following drugs should NOT be used in pregnancy, especially in the first trimester?", "options": [{"letter": "A", "text": "Bethanechol"}, {"letter": "B", "text": "Neostigmine"}, {"letter": "C", "text": "Pyridostigmine"}, {"letter": "D", "text": "Physostigmine"}], "correct": "D", "correct_text": "Physostigmine", "explanation": "هذا الدواء يمكنه عبور المشيمة والوصول إلى الدورة الدموية للجنين، مما قد يسبب تشوهات أو أعراضاً جانبية خطيرة خلال الفترة الأولى من الحمل."}, {"num": 100, "question": "Atenolol is a cardioselective beta-1 blocker.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "الأتينولول يغلق مستقبلات بيتا-1 المتواجدة بالقلب بشكل انتقائي دون التأثير على مستقبلات بيتا-2 بالرئتين في الجرعات العلاجية الطبيعية."}, {"num": 101, "question": "Drugs that are absorbed via the GIT and circulated to the liver first via the hepatic portal vein are affected by the first pass effect.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "الأدوية التي تؤخذ عن طريق الفم وتُمتص من الجهاز الهضمي تمر أولاً عبر الوريد البابي إلى الكبد، حيث يتم استقلاب وتكسير جزء منها قبل أن تصل إلى مجرى الدم، وهذا ما يُعرف بـ \"تأثير المرور الأولي\" (First-pass effect)."}, {"num": 102, "question": "Which term describes the study of drug effects on the body?", "options": [{"letter": "A", "text": "Pharmacokinetics"}, {"letter": "B", "text": "Pharmacodynamics"}, {"letter": "C", "text": "Toxicology"}, {"letter": "D", "text": "Biochemistry"}], "correct": "B", "correct_text": "Pharmacodynamics", "explanation": "علم \"الديناميكية الدوائية\" (Pharmacodynamics) هو العلم الذي يدرس تأثير الدواء على الجسم، وكيف يتفاعل مع المستقبلات لإحداث الاستجابة الحيوية."}, {"num": 103, "question": "Protein binding of a drug affects its free active concentration.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "ارتباط الدواء ببروتينات بلازما الدم (مثل الألبومين) يجعله غیر نشط دوائياً، والجزء \"الحر\" (Free) وغير المرتبط فقط هو القادر على الخروج من الأوعية الدموية وإعطاء التأثير العلاجي."}, {"num": 104, "question": "Which route of drug administration provides the fastest onset of effect?", "options": [{"letter": "A", "text": "Oral"}, {"letter": "B", "text": "Topical"}, {"letter": "C", "text": "Intravenous"}, {"letter": "D", "text": "Rectal"}], "correct": "C", "correct_text": "Intravenous", "explanation": "الحقن الوريدي (IV) يضع الدواء مباشرة في الدورة الدموية الكبرى، مما يوفر أسرع استجابة طبية وتأثيراً فورياً، وهو الأفضل في حالات الطوارئ."}, {"num": 105, "question": "The half-life (t1/2) of a drug determines its duration of action.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "فترة عمر النصف هي الزمن اللازم لانخفاض تركيز الدواء في الدم إلى النصف. هذه المدة هي التي تحدد إلى متى سيستمر مفعول الدواء، وبالتالي تحدد عدد مرات تكرار الجرعة في اليوم."}, {"num": 106, "question": "Which organ is primarily responsible for drug metabolism?", "options": [{"letter": "A", "text": "Kidney"}, {"letter": "B", "text": "Liver"}, {"letter": "C", "text": "Heart"}, {"letter": "D", "text": "Lung"}], "correct": "B", "correct_text": "Liver", "explanation": "الكبد هو المصنع الكيميائي الرئيسي في الجسم، ويحتوي على إنزيمات متخصصة تقوم باستقلاب (Metabolism) وتكسير معظم الأدوية لتسهيل خروجها من الجسم."}, {"num": 107, "question": "Secondary hypertension is a disorder of unknown origin affecting more than 90% of patients.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "العبارة خاطئة. ارتفاع ضغط الدم \"الثانوي\" له سبب طبي واضح ومعروف (مثل أمراض الكلى). أما الارتفاع \"الأولي\" (Essential) فهو الذي يكون مجهول السبب ويمثل الأغلبية العظمى (أكثر من 90%)."}, {"num": 108, "question": "Which drug class reduces blood pressure by preventing Angiotensin II formation?", "options": [{"letter": "A", "text": "ACE inhibitors"}, {"letter": "B", "text": "Beta-blockers"}, {"letter": "C", "text": "Calcium channel blockers"}, {"letter": "D", "text": "Diuretics"}], "correct": "A", "correct_text": "ACE inhibitors", "explanation": "مثبطات الإنزيم المحول للأنجيوتنسين (ACE inhibitors) تمنع تكوين مادة الأنجيوتنسين II القابضة للأوعية الدموية، مما يؤدي إلى استرخائها وانخفاض ضغط الدم."}, {"num": 109, "question": "All drugs are absorbed at the same rate regardless of the route of administration.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "معدل امتصاص الدواء يختلف بشكل جذري بناءً على طريقة الإعطاء؛ فالحقن أسرع بكثير من الأقراص الفموية أو اللبوس الشرجي."}, {"num": 110, "question": "Which antihypertensive drug class can cause hyperkalemia (high potassium)?", "options": [{"letter": "A", "text": "ACE inhibitors"}, {"letter": "B", "text": "Thiazide diuretics"}, {"letter": "C", "text": "Loop diuretics"}, {"letter": "D", "text": "Beta-blockers"}], "correct": "A", "correct_text": "ACE inhibitors", "explanation": "أدوية (ACE inhibitors) تقلل من إفراز هرمون الألدوستيرون، مما يؤدي إلى احتباس البوتاسيوم في الجسم وارتفاع نسبته في الدم (Hyperkalemia)، على عكس الثيازيد الذي يسبب فقده."}, {"num": 111, "question": "If a drug increases the heart rate, it is said to have a positive inotropic effect.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "تأثير الدواء على معدل وسرعة ضربات القلب يُسمى تأثيراً \"ميقاتياً\" (Chronotropic). بينما التأثير الانقباضي (Inotropic) يشير إلى التأثير على \"قوة\" انقباض العضلة وليس السرعة."}, {"num": 112, "question": "A drug that binds to a receptor and activates it is called:", "options": [{"letter": "A", "text": "Antagonist"}, {"letter": "B", "text": "Agonist"}, {"letter": "C", "text": "Inhibitor"}, {"letter": "D", "text": "Carrier"}], "correct": "B", "correct_text": "Agonist", "explanation": "المحفز (Agonist) هو المادة أو الدواء الذي يمتلك القدرة على الارتباط بالمستقبلات وتنشيطها لإنتاج استجابة حيوية مماثلة للمواد الطبيعية الموجودة في الجسم."}, {"num": 113, "question": "Sublingual administration allows rapid absorption.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "المنطقة تحت اللسان غنية جداً بالشعيرات الدموية، مما يسمح للدواء بالانتقال المباشر والسريع إلى مجرى الدم متجنباً المرور بعصارات المعدة وإنزيمات الكبد."}, {"num": 114, "question": "Which organ primarily excretes drugs from the body?", "options": [{"letter": "A", "text": "Liver"}, {"letter": "B", "text": "Kidney"}, {"letter": "C", "text": "Heart"}, {"letter": "D", "text": "Lung"}], "correct": "B", "correct_text": "Kidney", "explanation": "الكليتان هما الفلتر الرئيسي في الجسم والمسؤول الأول عن التخلص من الأدوية ونواتج تكسيرها (إخراج الدواء) وطردها خارج الجسم عن طريق البول."}, {"num": 115, "question": "The incidence of morbidity and mortality does not significantly decrease when hypertension is diagnosed early and is properly treated.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "العبارة خاطئة تماماً. التشخيص المبكر والسيطرة السليمة على ارتفاع ضغط الدم يقللان بشكل حاسم وكبير جداً من معدلات الوفيات والجلطات والسكتات الدماغية وتلف الكلى."}, {"num": 116, "question": "Which of the following could be used in the chronic management of myasthenia gravis?", "options": [{"letter": "A", "text": "Neostigmine"}, {"letter": "B", "text": "Pyridostigmine"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", "text": "Edrophonium"}], "correct": "B", "correct_text": "Pyridostigmine", "explanation": "البيريدوستيجمين هو الخيار العلاجي المفضل والمستمر (المزمن) لمرضى وهن العضلات الوبيل، وذلك لأن فترة مفعوله أطول من النيوستجمين وأعراضه الجانبية أقل."}, {"num": 117, "question": "Parenteral administration includes intravenous (IV) and intramuscular (IM) routes.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "مصطلح (Parenteral) يعني طبياً أي طريق لإعطاء الدواء يتجاوز الجهاز الهضمي، ويشمل بشكل أساسي الحقن بجميع أنواعه (وريدي، عضلي، تحت الجلد)."}, {"num": 118, "question": "Which factor does NOT affect pharmacokinetics?", "options": [{"letter": "A", "text": "Age"}, {"letter": "B", "text": "Liver function"}, {"letter": "C", "text": "Patient weight"}, {"letter": "D", "text": "Tablet color"}], "correct": "D", "correct_text": "Tablet color", "explanation": "حركية الدواء تتأثر بعمر المريض، وزن الجسم، وحالة الكبد والكلى. أما لون القرص الدوائي أو شكل العلبة الخارجي فلا يؤثر نهائياً على امتصاص أو فعالية الدواء."}, {"num": 119, "question": "Cytochrome P450 inducers can increase the plasma concentration of a prodrug (inactive drug).", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "الدواء الأولي (Prodrug) يحتاج إلى إنزيمات الكبد ليتحول لصورته النشطة. محفزات الإنزيمات (Inducers) تُسرع من تكسيره وتحويله، مما يؤدي إلى انخفاض سريع في تركيز صورته الأولية (وليس زيادتها)، وارتفاع في تركيز المادة النشطة."}, {"num": 120, "question": "Which of the following is true about the receptors of the heart?", "options": [{"letter": "A", "text": "Bind and respond to epinephrine"}, {"letter": "B", "text": "Bind and respond to norepinephrine"}, {"letter": "C", "text": "Contains muscarinic receptors specific for acetylcholine"}, {"letter": "D", "text": "All of the above"}], "correct": "D", "correct_text": "All of the above", "explanation": "القلب يحتوي على نوعين من المستقبلات: مستقبلات أدرينالية (بيتا 1) تستجيب للإيبينفرين والنورإيبينفرين لزيادة نبض القلب، ومستقبلات كولينية (مسكارينية) تستجيب للأستيل كولين لإبطاء النبض."}, {"num": 121, "question": "What is the primary purpose of a drug in pharmacology?", "options": [{"letter": "A", "text": "To provide nutrition"}, {"letter": "B", "text": "To diagnose, treat, or prevent disease"}, {"letter": "C", "text": "To alter genetic structure"}, {"letter": "D", "text": "To replace hormones only"}], "correct": "B", "correct_text": "To diagnose, treat, or prevent disease", "explanation": "الهدف الأساسي لأي دواء في علم الأدوية هو استخدامه في تشخيص الأمراض، أو علاجها، أو الوقاية منها قبل حدوثها."}, {"num": 122, "question": "Activation of beta-2 receptors results in vasodilation in skeletal muscle blood vessels.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "تنشيط مستقبلات بيتا-2 في الأوعية الدموية المغذية للعضلات الهيكلية يؤدي إلى توسعها (Vasodilation) لزيادة تدفق الدم للعضلات أثناء المجهود أو حالات الطوارئ (الهروب أو القتال)."}, {"num": 123, "question": "Which of the following is NOT a side effect of anticholinergic drugs?", "options": [{"letter": "A", "text": "Dry mouth"}, {"letter": "B", "text": "Blurred vision"}, {"letter": "C", "text": "Bradycardia"}, {"letter": "D", "text": "Urinary retention"}], "correct": "C", "correct_text": "Bradycardia", "explanation": "مضادات الكولين (مثل الأتروبين) تمنع تأثير العصب الحائر على القلب، مما يؤدي إلى زيادة سرعة ضربات القلب (Tachycardia) وليس إبطاءها (Bradycardia). باقي الخيارات هي أعراض جانبية شهيرة لهذه الأدوية."}, {"num": 124, "question": "A drug is any chemical substance that has a biological effect on living tissue.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "هذا هو التعريف العلمي الشامل للدواء؛ فهو أي مادة كيميائية تُحدث تغييراً أو تأثيراً حيوياً (بيولوجياً) عند دخولها إلى الأنسجة الحية في الجسم."}, {"num": 125, "question": "Which drug is used in the diagnosis of myasthenia gravis?", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Edrophonium"}, {"letter": "C", "text": "Pilocarpine"}, {"letter": "D", "text": "Tropicamide"}], "correct": "B", "correct_text": "Edrophonium", "explanation": "الإيدروفونيوم هو دواء قصير المفعول جداً (يستمر لدقائق)، ويُستخدم لاختبار وتشخيص مرض وهن العضلات الوبيل (Myasthenia gravis)؛ حيث يؤدي حقنه إلى تحسن فوري ومؤقت في قوة العضلات لدى المريض."}, {"num": 126, "question": "Which of the following is an example of a chemical name of a drug?", "options": [{"letter": "A", "text": "Aspirin"}, {"letter": "B", "text": "Paracetamol"}, {"letter": "C", "text": "Acetylsalicylic acid"}, {"letter": "D", "text": "Tylenol"}], "correct": "C", "correct_text": "Acetylsalicylic acid", "explanation": "\"حمض الأسيتيل ساليساليك\" هو الاسم الكيميائي المعقد الذي يصف التركيب الجزيئي للدواء، بينما \"الأسبرين\" هو الاسم الشائع/العلمي، و\"تايلينول\" هو اسم تجاري."}, {"num": 127, "question": "Each drug has only one type of name (either generic or trade only).", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "العبارة خاطئة، لأن أي دواء يمتلك على الأقل 3 أنواع من الأسماء: الاسم الكيميائي (يصف تركيبه)، الاسم العلمي/العام (Generic - وهو الموحد عالمياً)، والاسم التجاري (Trade - ويختلف من شركة لأخرى)."}, {"num": 128, "question": "Parasympathetic activity is associated with:", "options": [{"letter": "A", "text": "Fear"}, {"letter": "B", "text": "Stress"}, {"letter": "C", "text": "Rest and digest"}, {"letter": "D", "text": "Exercise"}], "correct": "C", "correct_text": "Rest and digest", "explanation": "الجهاز العصبي نظير الودي (الباراسمبثاوي) هو المسؤول عن حالات الهدوء، الراحة، هضم الطعام، وتخزين الطاقة في الجسم (Rest and digest)."}, {"num": 129, "question": "Atropine is contraindicated in:", "options": [{"letter": "A", "text": "Bradycardia"}, {"letter": "B", "text": "Glaucoma"}, {"letter": "C", "text": "Motion sickness"}, {"letter": "D", "text": "Organophosphate poisoning"}], "correct": "B", "correct_text": "Glaucoma", "explanation": "الأتروبين يسبب اتساعاً في حدقة العين، مما يؤدي إلى تضييق زاوية تصريف السوائل داخل العين، ولذلك يُمنع تماماً استخدامه لمرضى المياه الزرقاء (الجلوكوما) لأنه سيرفع ضغط العين لمستويات خطيرة."}, {"num": 130, "question": "Carvedilol is a beta-blocker only that is effective as antihypertensive but mainly used in the treatment of heart failure.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "B", "correct_text": "FALSE", "explanation": "العبارة خاطئة لأن الكارفيديلول ليس \"حاصر بيتا فقط\" (Beta-blocker only)، بل هو يغلق مستقبلات ألفا وبيتا معاً (Mixed alpha and beta blocker)."}, {"num": 131, "question": "Cholinergic drugs that bind to muscarinic receptors can cause all the following EXCEPT:", "options": [{"letter": "A", "text": "Bradycardia"}, {"letter": "B", "text": "Bronchoconstriction"}, {"letter": "C", "text": "Mydriasis"}, {"letter": "D", "text": "Increased GI motility"}], "correct": "C", "correct_text": "Mydriasis", "explanation": "الأدوية الكولينية تسبب انقباض عضلة القزحية مما يؤدي إلى تضيق حدقة العين (Miosis)، وليس اتساعها (Mydriasis). الاتساع يحدث بسبب مضادات الكولين أو محفزات السمبثاوي."}, {"num": 132, "question": "Which drug can be used to reverse non-depolarizing neuromuscular blockers after surgery?", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Neostigmine"}, {"letter": "C", "text": "Pilocarpine"}, {"letter": "D", "text": "Tropicamide"}], "correct": "B", "correct_text": "Neostigmine", "explanation": "بعد انتهاء الجراحة، يُعطى النيوستجمين لزيادة مستويات الأستيل كولين في الوصلة العضلية، مما يتغلب على تأثير مرخيات العضلات (التي أُعطيت أثناء التخدير) ويعيد للعضلات قدرتها على الانقباض."}, {"num": 133, "question": "The parasympathetic nervous system originates from which regions?", "options": [{"letter": "A", "text": "Thoracic and lumbar"}, {"letter": "B", "text": "Cranial and sacral"}, {"letter": "C", "text": "Cervical and lumbar"}, {"letter": "D", "text": "Thoracic and sacral"}], "correct": "B", "correct_text": "Cranial and sacral", "explanation": "الألياف العصبية للجهاز الباراسمبثاوي تخرج من جذع الدماغ (الأعصاب القحفية Cranial) ومن المنطقة العجزية في أسفل الحبل الشوكي (Sacral)، ولذلك يُسمى (Craniosacral outflow)."}, {"num": 134, "question": "Which factor is NOT a reason for drug administration?", "options": [{"letter": "A", "text": "Relief of pain"}, {"letter": "B", "text": "Control of physiologic conditions"}, {"letter": "C", "text": "Personal preference without clinical indication"}, {"letter": "D", "text": "Treatment of abnormal conditions"}], "correct": "C", "correct_text": "Personal preference without clinical indication", "explanation": "الرغبة الشخصية للمريض دون وجود داعٍ أو سبب طبي (Clinical indication) ليست مبرراً أو سبباً لإعطاء أي دواء."}, {"num": 135, "question": "Tacrine is not used clinically any more due to its:", "options": [{"letter": "A", "text": "Nephrotoxic activity"}, {"letter": "B", "text": "Cardiotoxic activity"}, {"letter": "C", "text": "Hepatotoxic activity"}, {"letter": "D", "text": "Neurotoxic activity"}], "correct": "C", "correct_text": "Hepatotoxic activity", "explanation": "عقار التاكرين كان يُستخدم لعلاج الزهايمر، ولكنه سُحب وأوقف استخدامه إكلينيكياً لأنه يسبب تسمماً وضرراً بالغاً بخلايا الكبد (Hepatotoxicity)."}, {"num": 136, "question": "Stimulation of the sympathetic nervous system results in all of the following EXCEPT:", "options": [{"letter": "A", "text": "Increased heart rate"}, {"letter": "B", "text": "Bronchodilation"}, {"letter": "C", "text": "Increased GI motility"}, {"letter": "D", "text": "Mydriasis"}], "correct": "C", "correct_text": "Increased GI motility", "explanation": "الجهاز السمبثاوي (في حالات الخوف والهروب) يعمل على توقيف عمليات الهضم لتبفير الطاقة، وبالتالي فإنه \"يقلل\" من حركة الجهاز الهضمي ولا يزيدها."}, {"num": 137, "question": "Which of the following is NOT a symptom of cholinergic toxicity?", "options": [{"letter": "A", "text": "Salivation"}, {"letter": "B", "text": "Lacrimation"}, {"letter": "C", "text": "Dry mouth"}, {"letter": "D", "text": "Diarrhea"}], "correct": "C", "correct_text": "Dry mouth", "explanation": "التسمم الكوليني يتميز بزيادة هائلة في جميع إفرازات الجسم (لعاب، دموع، عرق، إسهال)، وبالتالي فإن \"جفاف الفم\" مستحيل أن يكون من أعراضه، بل هو من أعراض مضادات الكولين."}, {"num": 138, "question": "Which receptor mediates Bradycardia?", "options": [{"letter": "A", "text": "M1"}, {"letter": "B", "text": "M3"}, {"letter": "C", "text": "Nicotinic"}, {"letter": "D", "text": "M2"}], "correct": "D", "correct_text": "M2", "explanation": "مستقبلات المسكارنيك من النوع الثاني (M2) تتواجد بشكل أساسي في عضلة القلب، وعند تحفيزها بواسطة الأستيل كولين، تؤدي إلى تباطؤ معدل ضربات القلب (Bradycardia)."}, {"num": 139, "question": "The enzyme responsible for breaking down acetylcholine is:", "options": [{"letter": "A", "text": "Monoamine oxidase"}, {"letter": "B", "text": "Acetylcholinesterase"}, {"letter": "C", "text": "Catechol-O-methyltransferase"}, {"letter": "D", "text": "Tyrosine hydroxylase"}], "correct": "B", "correct_text": "Acetylcholinesterase", "explanation": "إنزيم (أستيل كولين إستريز) هو الإنزيم المتخصص المتواجد في الشق العصبي، ووظيفته التكسير السريع للأستيل كولين لإنهاء مفعوله ومنع التحفيز المستمر للعضلة."}, {"num": 140, "question": "Reversible cholinesterase inhibitors are used to treat:", "options": [{"letter": "A", "text": "Alzheimer's disease"}, {"letter": "B", "text": "Parkinson's disease"}, {"letter": "C", "text": "Huntington's disease"}, {"letter": "D", "text": "Multiple sclerosis"}], "correct": "A", "correct_text": "Alzheimer's disease", "explanation": "في مرض الزهايمر، يحدث نقص في الأستيل كولين بالدماغ. مثبطات إنزيم الكولينستيراز العكوسة (مثل الدونيبيزيل) تمنع تكسير الأستيل كولين المتبقي، مما يحسن الذاكرة والوظائف الإدراكية للمريض."}, {"num": 141, "question": "All of the following are under the control of somatic nerves EXCEPT:", "options": [{"letter": "A", "text": "Movement"}, {"letter": "B", "text": "Posture"}, {"letter": "C", "text": "Respiration"}, {"letter": "D", "text": "Digestion"}], "correct": "D", "correct_text": "Digestion", "explanation": "الأعصاب الجسدية (Somatic) تتحكم في العضلات الإرادية والحركات التي نتحكم بها مثل المشي والتنفس والوضعية، بينما الهضم عملية لا إرادية يقع التحكم فيها تحت إشراف الجهاز العصبي الذاتي (Autonomic) والجهاز المعوي."}, {"num": 142, "question": "Adrenal medulla receives innervation from:", "options": [{"letter": "A", "text": "Parasympathetic supply"}, {"letter": "B", "text": "Somatic nerve"}, {"letter": "C", "text": "Sympathetic supply"}, {"letter": "D", "text": "Enteric nervous system"}], "correct": "C", "correct_text": "Sympathetic supply", "explanation": "يتغذى نخاع الغدة الكظرية بشكل مباشر واستثنائي بواسطة ألياف عصبية سمبثاوية، لتحفيز إفراز الأدرينالين مباشرة في الدم في حالات الطوارئ."}, {"num": 143, "question": "Parathion is used as:", "options": [{"letter": "A", "text": "Medicine"}, {"letter": "B", "text": "Insecticide"}, {"letter": "C", "text": "Fertilizer"}, {"letter": "D", "text": "Antibiotic"}], "correct": "B", "correct_text": "Insecticide", "explanation": "الباراثيون هو مركب فوسفاتي عضوي شديد السمية، ولا يُستخدم كدواء بشري، بل يُستخدم كمبيد حشري (Insecticide) في الزراعة."}, {"num": 144, "question": "Which of the following is contraindicated in intestinal or urinary bladder obstruction?", "options": [{"letter": "A", "text": "Bethanechol"}, {"letter": "B", "text": "Parathion"}, {"letter": "C", "text": "Neostigmine"}, {"letter": "D", "text": "All of the above"}], "correct": "C", "correct_text": "Neostigmine", "explanation": "زيادة الانقباضات العضلية الناتجة عن محفزات الكولين (مثل النيوستجمين) في ظل وجود انسداد ميكانيكي (مثل حصوة أو ورم) في الأمعاء أو المثانة قد يؤدي إلى تمزق هذه الأعضاء، ولذلك يُمنع استخدامها تماماً."}, {"num": 145, "question": "Which of the following could be used in pheochromocytoma?", "options": [{"letter": "A", "text": "Propranolol"}, {"letter": "B", "text": "Phenoxybenzamine"}, {"letter": "C", "text": "Dobutamine"}, {"letter": "D", "text": "Atropine"}], "correct": "B", "correct_text": "Phenoxybenzamine", "explanation": "الفينوكسيبنزامين هو حاصر غير عكسي لمستقبلات ألفا، ويُستخدم للتحكم في نوبات ارتفاع ضغط الدم الشديدة الناتجة عن ورم القواتم (Pheochromocytoma) في الغدة الكظرية قبل استئصاله جراحياً."}, {"num": 146, "question": "What is a disadvantage of rectal drug administration?", "options": [{"letter": "A", "text": "First pass effect"}, {"letter": "B", "text": "100% bioavailability"}, {"letter": "C", "text": "Irritation of mucosa"}, {"letter": "D", "text": "Easy to administer"}], "correct": "C", "correct_text": "Irritation of mucosa", "explanation": "من أبرز عيوب استخدام اللبوس (عن طريق الشرج) أنه قد يسبب تهيجاً والتهاباً في الأغشية المخاطية المبطنة للمستقيم."}, {"num": 147, "question": "What is the primary advantage of oral drug administration?", "options": [{"letter": "A", "text": "Rapid absorption"}, {"letter": "B", "text": "High risk of infection"}, {"letter": "C", "text": "Rapid systemic effects"}, {"letter": "D", "text": "Low risk of infection"}], "correct": "D", "correct_text": "Low risk of infection", "explanation": "البلع الفموي يعتبر الطريقة الأكثر أماناً لأنه غير اختراقي (على عكس الحقن)، مما يجعله يخلو تقريباً من مخاطر نقل العدوى أو تلوث الدم."}, {"num": 148, "question": "Which of the following drugs is a cholinesterase reactivator?", "options": [{"letter": "A", "text": "Neostigmine"}, {"letter": "B", "text": "Edrophonium"}, {"letter": "C", "text": "Pralidoxime"}, {"letter": "D", "text": "Physostigmine"}], "correct": "C", "correct_text": "Pralidoxime", "explanation": "البراليدوكسيم يعمل على فك الارتباط السام بين الفوسفات العضوي وإنزيم الكولينستيراز، مما \"يعيد تنشيط\" الإنزيم مرة أخرى ليقوم بدوره الطبيعي في الجسم."}, {"num": 149, "question": "Which of the following anticholinergic agents is used in COPD (Chronic Obstructive Pulmonary Disease) treatment?", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Ipratropium"}, {"letter": "C", "text": "Pilocarpine"}, {"letter": "D", "text": "Physostigmine"}], "correct": "B", "correct_text": "Ipratropium", "explanation": "الإيبراتروبيوم يمنع انقباض الشعب الهوائية ويقلل الإفرازات المخاطية في الرئتين عند استنشاقه، مما يجعله خياراً ممتازاً لمرضى الانسداد الرئوي المزمن والربو."}, {"num": 150, "question": "What is a common example of a drug administered via the nasal route?", "options": [{"letter": "A", r cholinergic agonists.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "الأتروبين هو مضاد لمستقبلات المسكارين، ولذلك يُستخدم بنجاح كـ \"ترياق\" لوقف وعكس التأثيرات السامة الناتجة عن الجرعات الزائدة من الأدوية المحفزة للكولين."}, {"num": 156, "question": "Which of the following is considered as anticholinesterase?", "options": [{"letter": "A", "text": "Galantamine"}, {"letter": "B", "text": "Neostigmine"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", "text": "All of the above"}], "correct": "D", "correct_text": "All of the above", "explanation": "جميع الأدوية المذكورة (الجالانتامين، النيوستجمين، الفيزوستجمين) تنتمي إلى مجموعة مضادات (مثبطات) إنزيم الكولينستيراز، وتعمل على زيادة نسبة الأستيل كولين في الجسم."}, {"num": 157, "question": "Which receptor is responsible for heart rate and contractility?", "options": [{"letter": "A", "text": "Alpha-1"}, {"letter": "B", "text": "Alpha-2"}, {"letter": "C", "text": "Beta-1"}, {"letter": "D", "text": "Beta-2"}], "correct": "C", "correct_text": "Beta-1", "explanation": "مستقبلات بيتا-1 تتواجد بشكل رئيسي وأساسي في عضلة القلب، وهي المسؤولة عن زيادة معدل ضربات القلب (Chronotropic) وقوة انقباضه (Inotropic) عند تحفيزها."}, {"num": 158, "question": "What is a common example of a drug administered via the transdermal route?", "options": [{"letter": "A", "text": "Insulin"}, {"letter": "B", "text": "Nitroglycerin"}, {"letter": "C", "text": "Oxymetazoline"}, {"letter": "D", "text": "Scopolamine"}], "correct": "D", "correct_text": "Scopolamine", "explanation": "السكوبولامين يتوفر بشكل شائع جداً على هيئة لاصقات جلدية (Transdermal patches) توضع خلف الأذن للوقاية من الغثيان ودوار الحركة بشكل مستمر."}, {"num": 159, "question": "Which of the following is a reversible cholinesterase inhibitor?", "options": [{"letter": "A", "text": "Organophosphate"}, {"letter": "B", "text": "Atropine"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", , "correct": "A", "correct_text": "Norepinephrine", "explanation": "النورإيبينفرين يعمل بشكل مباشر على مستقبلات ألفا ومستقبلات بيتا-1 القلبية، على عكس الميثوكسامين (ألفا فقط) أو الإيزوبروتيرنول (بيتا فقط) أو الإيفيدرين (غير مباشر)."}, {"num": 198, "question": "Cardiac output is the % of blood ejected per stroke relative to the total amount in the ventricle.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "تم اعتبار العبارة صحيحة بحسب النموذج المرفق، رغم أن التعريف الدقيق للناتج القلبي هو حجم الدم الكلي الذي يضخه القلب في الدقيقة الواحدة (لكن التزمنا بنموذج الحل)."}, {"num": 199, "question": "Goal of blood pressure in all hypertensive patients is BP < 120/80 mmHg.", "options": [{"letter": "A", "text": "TRUE"}, {"letter": "B", "text": "FALSE"}], "correct": "A", "correct_text": "TRUE", "explanation": "تعتبر هذه القراءات هي المستويات المثالية لضغط الدم البشري لحماية الشرايين وأعضاء الجسم الحيوية من مضاعفات الارتفاع المزمن (العبارة صحيحة وفقاً لنموذج الحل المرفق)."}, {"num": 200, "question": "Drug for xerostomia:", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Neostigmine"}, {"letter": "C", "text": "Malathion"}, {"letter": "D", "text": "Pilocarpine"}], "correct": "D", "correct_text": "Pilocarpine", "explanation": "البيلوكاربين يعمل كمحفز للمستقبلات المسكارينية، مما يؤدي إلى زيادة الإفرازات في الجسم بما في ذلك الغدد اللعابية لعلاج جفاف الفم."}];

let curIdx = 0;
let answered = {};

/* Init */
function init() {
  const t = localStorage.getItem('pharma-theme');
  if (t === 'light') document.body.classList.add('light-mode');
  updateThemeBtn();
}

function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').classList.add('active');
  renderNav();
  renderQ();
}

/* Theme */
function toggleTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('pharma-theme', isLight ? 'light' : 'dark');
  updateThemeBtn();
}

function updateThemeBtn() {
  const isLight = document.body.classList.contains('light-mode');
  document.getElementById('themeBtn').textContent = isLight ? '&#9728;&#65039;' : '&#127769;';
}

/* Question Nav Dots */
function renderNav() {
  const row = document.getElementById('qNavRow');
  let html = '';
  const start = Math.max(0, curIdx - 4);
  const end = Math.min(questions.length, curIdx + 5);
  for (let i = start; i < end; i++) {
    const q = questions[i];
    let cls = 'q-nav-btn';
    if (i === curIdx) cls += ' active';
    if (answered[q.num] && answered[q.num].correct) cls += ' answered-correct';
    if (answered[q.num] && !answered[q.num].correct) cls += ' answered-wrong';
    html += `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  }
  row.innerHTML = html;
}

function goTo(i) {
  curIdx = i;
  renderNav();
  renderQ();
}

/* Render Question */
function renderQ() {
  const container = document.getElementById('questionContainer');
  const q = questions[curIdx];
  const ans = answered[q.num];
  const isTF = q.options.length === 2 && q.options.some(o => o.text === 'TRUE') && q.options.some(o => o.text === 'FALSE');
  const typeLabel = isTF ? 'True / False' : 'Multiple Choice';

  let optsHTML = '';
  q.options.forEach(opt => {
    let cls = 'opt-btn';
    if (ans) {
      cls += ' disabled';
      if (opt.letter === q.correct) {
        cls += (ans.selected === q.correct) ? ' correct' : ' show-correct';
      }
      if (opt.letter === ans.selected && !ans.correct) cls += ' wrong';
      if (opt.letter === ans.selected && ans.correct) cls += ' correct';
    }
    optsHTML += `<button class="${cls}" onclick="pick(${curIdx},'${opt.letter}')" ${ans ? 'disabled' : ''}>` +
      `<span class="opt-letter">${opt.letter}</span><span style="position:relative;z-index:1">${esc(opt.text)}</span></button>`;
  });

  let expHTML = '';
  if (ans) {
    const icon = ans.correct ? '&#127881;' : '&#128532;';
    const text = ans.correct ? 'Correct Answer!' : 'Wrong Answer!';
    const tc = ans.correct ? 'correct-text' : 'wrong-text';
    expHTML = `<div class="explanation-panel">
      <div class="exp-header">
        <span class="exp-icon">${icon}</span>
        <span class="exp-result ${tc}">${text}</span>
      </div>
      <div class="exp-label">&#128214; &#1575;&#1604;&#1588;&#1585;&#1581;:</div>
      <div class="exp-text">${esc(q.explanation || '')}</div>
    </div>`;
  }

  container.innerHTML = `<div class="question-card glass">
    <div class="q-header">
      <span class="q-number">Q${curIdx + 1} / ${questions.length}</span>
      <span class="q-type">${typeLabel}</span>
    </div>
    <div class="q-text">${esc(q.question)}</div>
    <div class="options-list">${optsHTML}</div>
    ${expHTML}
  </div>`;

  updateStats();
  updateNav();
  renderNav();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function pick(idx, letter) {
  const q = questions[idx];
  if (answered[q.num]) return;
  const ok = letter === q.correct;
  answered[q.num] = { selected: letter, correct: ok };
  renderQ();
  if (ok) confetti();
}

function navQ(dir) {
  const ni = curIdx + dir;
  if (ni >= 0 && ni < questions.length) {
    curIdx = ni;
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function jumpTo() {
  const num = parseInt(document.getElementById('jumpInput').value);
  if (num >= 1 && num <= questions.length) {
    curIdx = num - 1;
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function updateNav() {
  document.getElementById('prevBtn').disabled = curIdx === 0;
  document.getElementById('nextBtn').disabled = curIdx >= questions.length - 1;
  if (Object.keys(answered).length >= questions.length * 0.5) {
    document.getElementById('finishBtn').style.display = 'inline-block';
  }
}

function updateStats() {
  const total = questions.length;
  const solved = Object.keys(answered).length;
  const correct = Object.values(answered).filter(a => a.correct).length;
  const wrong = Object.values(answered).filter(a => !a.correct).length;
  const pct = Math.round((solved / total) * 100);

  document.getElementById('solvedCount').textContent = solved;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressTxt').textContent = solved + ' / ' + total;
  document.getElementById('progressFill').style.width = pct + '%';
}

function filterQ(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let indices;
  if (f === 'all') indices = questions.map((_, i) => i);
  else if (f === 'unanswered') indices = questions.map((_, i) => i).filter(i => !answered[questions[i].num]);
  else if (f === 'correct') indices = questions.map((_, i) => i).filter(i => answered[questions[i].num] && answered[questions[i].num].correct);
  else if (f === 'wrong') indices = questions.map((_, i) => i).filter(i => answered[questions[i].num] && !answered[questions[i].num].correct);
  if (indices.length > 0) { curIdx = indices[0]; renderQ(); }
}

/* Confetti */
function confetti() {
  const box = document.getElementById('confettiBox');
  const colors = ['#4fc3f7', '#9c88ff', '#4caf50', '#ffd54f', '#ef5350', '#ffffff'];
  for (let i = 0; i < 45; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-p';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * .5 + 's';
    p.style.animationDuration = (1 + Math.random()) + 's';
    const sz = 6 + Math.random() * 8;
    p.style.width = sz + 'px';
    p.style.height = sz + 'px';
    box.appendChild(p);
    setTimeout(() => p.remove(), 2200);
  }
}

/* Results */
function showResults() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  const total = questions.length;
  const correct = Object.values(answered).filter(a => a.correct).length;
  const wrong = Object.values(answered).filter(a => !a.correct).length;
  const skip = total - correct - wrong;
  const pct = Math.round((correct / total) * 100);

  let cls = 'poor', title = 'Keep Practicing!', emoji = '&#128170;';
  if (pct >= 80) { cls = 'excellent'; title = 'Excellent Work!'; emoji = '&#127942;'; }
  else if (pct >= 50) { cls = 'good'; title = 'Good Effort!'; emoji = '&#128077;'; }

  document.getElementById('resultsEmoji').innerHTML = emoji;
  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('resultsScore').textContent = correct + '/' + total;
  document.getElementById('resultsScore').className = 'results-score ' + cls;
  document.getElementById('resultsPct').textContent = pct + '% Accuracy';
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent = wrong;
  document.getElementById('resSkip').textContent = skip;
  document.getElementById('resBarOk').style.width = (correct / total * 100) + '%';
  document.getElementById('resBarErr').style.width = (wrong / total * 100) + '%';
  if (pct >= 80) confetti();
}

function restartQuiz() {
  answered = {};
  curIdx = 0;
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  renderNav();
  renderQ();
}

/* Keyboard */
document.addEventListener('keydown', e => {
  if (!document.getElementById('quizScreen').classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') navQ(-1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') navQ(1);
  if (e.key >= '1' && e.key <= '4') {
    const q = questions[curIdx];
    if (!answered[q.num]) {
      const idx = parseInt(e.key) - 1;
      if (idx < q.options.length) pick(curIdx, q.options[idx].letter);
    }
  }
});

/* Light mode override */
const lightStyle = document.createElement('style');
lightStyle.textContent = `

  background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 50%, #e8eaf6 100%);

init();
</script>
